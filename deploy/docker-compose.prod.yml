# 운영 서버(EC2) 한 대에서 Nginx(HTTPS) + Certbot(인증서 갱신) + Spring 서버 + PostgreSQL 을 함께 띄운다.
# 처음 한 번: ./init-letsencrypt.sh (인증서 발급). 이후 배포: deploy.sh (GitHub Actions 가 실행)
# 값은 같은 폴더의 .env 에서 읽는다 (.env.example 참고, .env 는 커밋하지 않는다).
services:
  nginx:
    image: nginx:1.30             # 안정(stable) 버전 계열
    restart: unless-stopped
    ports:
      - '80:80'                   # 인증서 발급 확인(acme-challenge) + https 로 이동
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}           # templates/*.template 의 ${DOMAIN} 을 채운다
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # 6시간마다 설정을 다시 불러와서, certbot 이 갱신한 인증서를 끊김 없이 반영한다
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"'
    depends_on:
      - app

  certbot:
    image: certbot/certbot:v5.10.0
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt   # 발급받은 인증서 보관 (지우면 재발급 → 발급 횟수 제한에 걸릴 수 있음)
      - certbot-www:/var/www/certbot
    # 12시간마다 갱신 시도. 만료 30일 전부터만 실제로 갱신한다 (Let's Encrypt 인증서는 90일짜리)
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  app:
    # 평소에는 GitHub Actions 가 ECR 에 올린 이미지를 받는다 (deploy.sh 가 .env 의 APP_IMAGE 를 갱신)
    # APP_IMAGE 가 없으면 서버에서 직접 빌드한 로컬 이미지 이름을 쓴다 (up -d --build)
    image: ${APP_IMAGE:-kkobak-med-server:local}
    build: ..                     # 저장소 루트의 Dockerfile 로 이미지를 만든다
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    # 8080 은 밖에 열지 않는다. 바깥 요청은 Nginx(443)만 받아서 안쪽으로 넘긴다
    mem_limit: 1g                 # Dockerfile 의 MaxRAMPercentage=75 가 이 한도를 기준으로 힙을 잡는다
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    # 서버 자신(127.0.0.1)에서만 열린다 → 인터넷에서는 닫혀 있고, SSH 터널(DataGrip 등)로만 들어온다
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  certbot-etc:
  certbot-www:
  db-data:
