spring:
  application:
    name: kkobak-med-server

  # 프로필은 여기서 기본값을 주지 않는다. 운영에서 프로필 지정을 빼먹어도 local 설정(dev 페이지, 기본 비밀키 등)이 켜지지 않고,
  # 아래 필수 환경변수(DB_URL, JWT_SECRET, GOOGLE_CLIENT_ID 등)가 없어서 서버가 뜨지 않는 게 의도한 동작이다.
  # 로컬은 ./gradlew bootRun 이 local 프로필을 켜 준다 (build.gradle). 테스트는 src/test/resources/application.properties 참고.

  # DB 접속 정보는 프로필 파일(application-local.yml)이나 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD)로 받는다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false      # 화면(응답) 단계까지 DB 연결을 붙잡고 있지 않는다
    hibernate:
      ddl-auto: none         # 테이블은 Flyway 마이그레이션으로만 만든다

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful         # 종료할 때 처리 중인 요청은 끝내고 닫는다

management:
  endpoints:
    web:
      exposure:
        include: health      # 헬스체크: /actuator/health

# 인증 (Google 로그인 + JWT). 비밀값은 환경변수로 받는다.
kkobak:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID}       # 프론트의 Google 로그인과 같은 OAuth 클라이언트 ID
    jwt-secret: ${JWT_SECRET}                   # Access Token 서명 키 (32바이트 이상)
    access-token-validity: 30m
    refresh-token-validity: 14d
    refresh-cookie-secure: true                 # HTTPS 에서만 쿠키 전송
    refresh-cookie-same-site: Lax
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}   # CORS 허용할 프론트 주소 (쉼표로 여러 개)

springdoc:
  # 로컬 전용 개발 도구(/dev/**)는 API 문서에 넣지 않는다
  paths-to-exclude: /dev/**
