name: Deploy

# main 의 CI(빌드 + 테스트)가 성공했을 때만 운영 서버(EC2)에 배포한다
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # Actions 화면에서 손으로 다시 배포할 때

# 배포가 겹치지 않게 한 번에 하나만 (뒤에 온 것이 앞의 것을 취소하지는 않음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # GitHub OIDC 로 AWS 임시 자격 증명을 받는다 (액세스 키를 저장하지 않음)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::505906471671:role/kkobak-github-deploy
  ECR_REPOSITORY: kkobak-med-server
  EC2_INSTANCE_ID: i-03b63ffcc1d3c7782
  HEALTH_URL: https://api.kkobak-med.click/actuator/health

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04-arm # 서버(t4g, ARM)와 같은 아키텍처에서 빌드
    # environment 를 지정하면 OIDC 토큰의 sub 가 바뀌어 AWS 역할 신뢰 조건(main 브랜치)과 맞지 않게 되므로 쓰지 않는다
    steps:
      - uses: actions/checkout@v7
        with:
          # CI 가 검사한 바로 그 커밋을 배포한다
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - id: image
        # 이미지 태그 = 배포할 커밋 SHA (어떤 코드가 떠 있는지 바로 알 수 있게)
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSM 으로 EC2 에서 실행 (SSH 포트를 열지 않는다)
      # 먼저 저장소를 받아야 새로 추가/수정된 deploy.sh 를 실행할 수 있다
      - name: Deploy to EC2
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${COMMIT_SHA::12}" \
            --parameters "commands=[\"sudo -u ec2-user git -C /home/ec2-user/kkobak-med-server pull --ff-only\",\"bash /home/ec2-user/kkobak-med-server/deploy/deploy.sh ${{ steps.image.outputs.uri }}\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          # 최대 5분 동안 끝날 때까지 기다린다
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "status: $STATUS"
          test "$STATUS" = "Success"

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -fsS "$HEALTH_URL" | grep -q '"status":"UP"' && echo "UP" && exit 0
            sleep 3
          done
          echo "health check failed" && exit 1
